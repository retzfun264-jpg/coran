<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Widget</title>

<style>
:root{
  --bg:#191919;
  --card:#202020;
  --border:rgba(255,255,255,.09);
  --text:#f2f2f2;
  --muted:#9b9b9b;
  --gold:#d8ad5b;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#191919!important;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:12px;
}

/* HEADER */

.header{
  margin-bottom:12px;
}

.title{
  display:flex;
  align-items:center;
  gap:9px;
}

.title-icon{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(216,173,91,.12);
  color:var(--gold);
}

h1{
  margin:0;
  font-size:21px;
}

.subtitle{
  margin:3px 0 0;
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */

.search-card{
  padding:11px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
}

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

input{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#171717;
  color:var(--text);
  font-size:12px;
}

input:focus{
  border-color:rgba(216,173,91,.55);
}

.search-btn{
  border:0;
  padding:0 15px;
  border-radius:9px;
  background:linear-gradient(135deg,#e1bb70,#b98735);
  color:#18120a;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

/* VERSE */

.verse-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(216,173,91,.035),transparent 50%),
    var(--card);
}

.verse-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.reference{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
}

.play{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  cursor:pointer;
}

.arabic{
  margin:4px 0 17px;
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:28px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
}

.translit{
  margin-bottom:13px;
  color:#d8d8d8;
  font-size:12px;
  line-height:1.65;
  font-style:italic;
}

.translation{
  padding-top:12px;
  border-top:1px solid var(--border);
  color:#bdbdbd;
  font-size:12px;
  line-height:1.65;
}

.label{
  display:block;
  margin-bottom:5px;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* FLECHES */

.navigation{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.arrow{
  width:42px;
  height:36px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#292929;
  color:var(--text);
  font-size:20px;
  cursor:pointer;
  transition:.2s;
}

.arrow:hover{
  background:rgba(216,173,91,.15);
  border-color:rgba(216,173,91,.4);
  color:var(--gold);
}

.arrow:disabled{
  opacity:.3;
  cursor:not-allowed;
}

.verse-number{
  color:var(--muted);
  font-size:10px;
  text-align:center;
}

.message{
  padding:20px;
  border:1px dashed var(--border);
  border-radius:12px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

/* MOBILE */

@media(max-width:480px){

  .app{
    padding:9px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .search-btn{
    height:37px;
  }

  .arabic{
    font-size:25px;
  }

}
</style>
</head>

<body>

<main class="app">

<header class="header">

  <div class="title">
    <div class="title-icon">☪</div>
    <h1>Quran</h1>
  </div>

  <p class="subtitle">
    Search a surah and verse
  </p>

</header>


<section class="search-card">

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Ex : baq 255, fati 1, 2:255..."
      autocomplete="off"
    >

    <button
      class="search-btn"
      id="searchBtn"
      type="button">
      Search
    </button>

  </div>

</section>


<section id="result">

  <div class="message">
    Recherche un verset pour commencer.
  </div>

</section>

</main>


<script>

const API="https://api.alquran.cloud/v1";

const searchInput=

const searchBtn=

const result=

let currentSurah=null;
let currentVerse=null;
let currentAudio=null;


/* =================================

/* =================================
   NORMALISATION
================================= */

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/['’]/g,"")
    .replace(/[-]/g," ")
    .replace(/\b(al|surah|sourate|verset|verse|ayah)\b/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* =================================
   RECHERCHE INTELLIGENTE
================================= */

function findSurah(name){

  const query=normalize(name);

  if(!query)return null;


  /* Correspondance exacte */

  let result=
    surahs.find(
      s=>normalize(s[0])===query
    );

  if(result)return result;


  /* Commence par */

  result=
    surahs.find(
      s=>normalize(s[0]).startsWith(query)
    );

  if(result)return result;


  /* Contient */

  result=
    surahs.find(
      s=>normalize(s[0]).includes(query)
    );

  if(result)return result;


  /*
    Recherche lettre par lettre.
    Exemple :
    bq → baqara
    fti → fatiha
  */

  let best=null;
  let bestScore=0;

  for(const s of surahs){

    const target=normalize(s[0]);

    let score=0;
    let index=0;

    for(const char of query){

      const found=
        target.indexOf(char,index);

      if(found!==-1){

        score++;
        index=found+1;

      }

    }

    const ratio=
      score/query.length;

    if(ratio>bestScore){

      bestScore=ratio;
      best=s;

    }

  }

  if(bestScore>=0.6){
    return best;
  }

  return null;

}


/* =================================
   PARSE SEARCH
================================= */

function parseSearch(text){

  const query=normalize(text);


  /* 2:255 */

  let match=
    query.match(
      /^(\d{1,3})\s*:\s*(\d{1,3})$/
    );

  if(match){

    return{
      surah:Number(match[1]),
      verse:Number(match[2])
    };

  }


  /* 2 255 */

  match=
    query.match(
      /^(\d{1,3})\s+(\d{1,3})$/
    );

  if(match){

    const surah=
      Number(match[1]);

    const verse=
      Number(match[2]);

    if(surah>=1 && surah<=114){

      return{
        surah,
        verse
      };

    }

  }


  /* baq 255 */

  match=
    query.match(
      /^(.+?)\s+(\d{1,3})$/
    );

  if(!match)return null;

  const name=match[1];
  const verse=Number(match[2]);

  const found=
    findSurah(name);

  if(!found)return null;

  return{
    surah:found[1],
    verse
  };

}


/* =================================
   CHARGER UN VERSET
================================= */

async function loadVerse(surah,verse){

  if(currentAudio){

    currentAudio.pause();

  }

  currentSurah=surah;
  currentVerse=verse;

  result.innerHTML=
    `<div class="message">Chargement...</div>`;


  try{

    const responses=
      await Promise.all([

        fetch(
          `${API}/ayah/${surah}:${verse}/quran-uthmani`
        ),

        fetch(
          `${API}/ayah/${surah}:${verse}/fr.hamidullah`
        ),

        fetch(
          `${API}/ayah/${surah}:${verse}/en.transliteration`
        ),

        fetch(
          `${API}/ayah/${surah}:${verse}/ar.alafasy`
        ),

        fetch(
          `${API}/surah/${surah}`
        )

      ]);


    const[
      arabicResponse,
      frenchResponse,
      translitResponse,
      audioResponse,
      surahResponse
    ]=responses;


    const[
      arabicData,
      frenchData,
      translitData,
      audioData,
      surahData
    ]=
      await Promise.all([

        arabicResponse.json(),
        frenchResponse.json(),
        translitResponse.json(),
        audioResponse.json(),
        surahResponse.json()

      ]);


    const arabic=
      arabicData.data.text;

    const french=
      frenchData.data.text;

    const translit=
      translitData.data.text;

    const audio=
      audioData.data.audio;

    const surahName=
      arabicData.data.surah.englishName;

    const total=
      surahData.data.numberOfAyahs;


    result.innerHTML=`

      <article class="verse-card">

        <div class="verse-top">

          <span class="reference">
            ${surahName} · ${verse}
          </span>

          <button
            class="play"
            id="playBtn">
            ▶
          </button>

        </div>


        <div class="arabic">
          ${arabic}
        </div>


        <div class="translit">

          <span class="label">
            Transliteration
          </span>

          ${translit}

        </div>


        <div class="translation">

          <span class="label">
            Traduction française
          </span>

          ${french}

        </div>


        <audio
          id="audio"
          preload="none"
          src="${audio}">
        </audio>


        <!-- FLECHES -->

        <div class="navigation">

          <button
            class="arrow"
            id="previous"
            title="Verset précédent"
            ${surah===1 && verse===1 ? "disabled":""}>
            ←
          </button>


          <span class="verse-number">
            ${surah}:${verse}
          </span>


          <button
            class="arrow"
            id="next"
            title="Verset suivant">
            →
          </button>

        </div>

      </article>

    `;


    /* AUDIO */

    const play=
      document.getElementById("playBtn");

    currentAudio=
      document.getElementById("audio");


    play.onclick=
      async()=>{

        if(currentAudio.paused){

          await currentAudio.play();

          play.textContent="❚❚";

        }else{

          currentAudio.pause();

          play.textContent="▶";

        }

      };


    currentAudio.onended=
      ()=>{
        play.textContent="▶";
      };


    /* FLECHE PRECEDENTE */

    document.getElementById("previous")
      .onclick=
      async()=>{

        if(currentVerse>1){

          await loadVerse(
            currentSurah,
            currentVerse-1
          );

        }else if(currentSurah>1){

          const response=
            await fetch(
              `${API}/surah/${currentSurah-1}`
            );

          const data=
            await response.json();

          await loadVerse(
            currentSurah-1,
            data.data.numberOfAyahs
          );

        }

      };


    /* FLECHE SUIVANTE */

    document.getElementById("next")
      .onclick=
      async()=>{

        if(currentVerse<total){

          await loadVerse(
            currentSurah,
            currentVerse+1
          );

        }else if(currentSurah<114){

          await loadVerse(
            currentSurah+1,
            1
          );

        }

      };


    /* Met à jour la recherche */

    searchInput.value=
      `${currentSurah}:${currentVerse}`;


  }catch(error){

    result.innerHTML=
      `<div class="message">
        Impossible de charger ce verset.
      </div>`;

  }

}


/* =================================
   RECHERCHE
================================= */

async function searchVerse(){

  const query=
    searchInput.value.trim();

  if(!query)return;

  const parsed=
    parseSearch(query);

  if(!parsed){

    result.innerHTML=`
      <div class="message">

        Verset introuvable.

        <br><br>

        <small>
          Essaie :
          <b>baq 255</b>,
          <b>fati 1</b>,
          <b>rahm 13</b>,
          <b>mulk 2</b>
          ou
          <b>2:255</b>
        </small>

      </div>
    `;

    return;

  }

  await loadVerse(
    parsed.surah,
    parsed.verse
  );

}


/* =================================
   EVENTS
================================= */

searchBtn.onclick=
  searchVerse;

searchInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){
      searchVerse();
    }

  }
);

</script>
