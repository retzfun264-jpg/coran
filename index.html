<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Widget</title>

<style>
:root{
  --bg:#191919;
  --card:#202020;
  --border:rgba(255,255,255,.09);
  --text:#f2f2f2;
  --muted:#9b9b9b;
  --gold:#d8ad5b;
  --gold2:#b98735;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg)!important;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:12px;
}

.header{margin-bottom:12px}

.title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:3px;
}

.title-icon{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:17px;
}

h1{
  margin:0;
  font-size:21px;
  letter-spacing:-.7px;
}

.subtitle{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */

.search-card{
  padding:11px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
}

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

input{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#171717;
  color:var(--text);
  font-size:12px;
}

input:focus{
  border-color:rgba(216,173,91,.55);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

.search-btn{
  padding:0 15px;
  border-radius:9px;
  background:linear-gradient(135deg,#e1bb70,#b98735);
  color:#18120a;
  font-size:12px;
  font-weight:800;
}

/* VERSE */

.verse-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(216,173,91,.035),transparent 50%),
    var(--card);
}

.verse-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.reference{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
}

.play{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:13px;
  transition:.2s;
}

.play:hover{
  background:rgba(216,173,91,.2);
  transform:scale(1.05);
}

.arabic{
  margin:4px 0 17px;
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:28px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
}

.translit{
  margin-bottom:13px;
  color:#d8d8d8;
  font-size:12px;
  line-height:1.65;
  font-style:italic;
}

.translation{
  padding-top:12px;
  border-top:1px solid var(--border);
  color:#bdbdbd;
  font-size:12px;
  line-height:1.65;
}

.label{
  display:block;
  margin-bottom:5px;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* NAVIGATION */

.navigation{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-top:14px;
}

.nav-btn{
  height:36px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card);
  color:#d7d7d7;
  font-size:11px;
  transition:.2s;
}

.nav-btn:hover{
  background:#292929;
  border-color:rgba(216,173,91,.3);
  color:var(--gold);
}

.nav-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.page{
  color:var(--muted);
  font-size:10px;
  text-align:center;
  white-space:nowrap;
}

.message{
  padding:20px;
  border:1px dashed var(--border);
  border-radius:12px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

.suggestions{
  margin-top:8px;
  color:var(--muted);
  font-size:10px;
  text-align:center;
}

@media(max-width:480px){

  .app{padding:9px}

  .search{
    grid-template-columns:1fr;
  }

  .search-btn{height:37px}

  .arabic{font-size:25px}

  .navigation{
    grid-template-columns:1fr 60px 1fr;
  }

  .nav-btn{
    padding:0 6px;
    font-size:10px;
  }
}
</style>
</head>

/* =================================
   NORMALIZATION
================================= */

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/['’`]/g,"")
    .replace(/[-_]/g," ")
    .replace(/\bal\b/g," ")
    .replace(/\bsurah\b/g," ")
    .replace(/\bsourate\b/g," ")
    .replace(/\bchapter\b/g," ")
    .replace(/\bverset\b/g," ")
    .replace(/\bverse\b/g," ")
    .replace(/\bayah\b/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =================================
   LEVENSHTEIN DISTANCE
   → permet les fautes de frappe
================================= */

function levenshtein(a,b){

  const matrix=[];

  for(let i=0;i<=b.length;i++){
    matrix[i]=[i];
  }

  for(let j=0;j<=a.length;j++){
    matrix[0][j]=j;
  }

  for(let i=1;i<=b.length;i++){

    for(let j=1;j<=a.length;j++){

      if(b.charAt(i-1)===a.charAt(j-1)){

        matrix[i][j]=matrix[i-1][j-1];

      }else{

        matrix[i][j]=Math.min(
          matrix[i-1][j-1]+1,
          matrix[i][j-1]+1,
          matrix[i-1][j]+1
        );

      }

    }

  }

  return matrix[b.length][a.length];

}


/* =================================
   SURAH SEARCH INTELLIGENCE
================================= */

function findBestSurah(input){

  const query=normalize(input);

  if(!query)return null;

  let best=null;
  let bestScore=0;

  for(const s of surahs){

    const aliases=[
      s[0],
      s[2],
      s[3]
    ];

    for(const alias of aliases){

      const target=normalize(alias);

      let score=0;

      /* Exact */

      if(query===target){
        score=100;
      }

      /* Starts with */

      else if(target.startsWith(query)){
        score=90+(query.length/target.length)*5;
      }

      /* Query starts with target */

      else if(query.startsWith(target)){
        score=85;
      }

      else{

        /* Word similarity */

        const distance=
          levenshtein(query,target);

        const maxLength=
          Math.max(query.length,target.length);

        const similarity=
          1-(distance/maxLength);

        score=similarity*80;


        /* Character overlap */

        let common=0;

        for(const char of query){

          if(target.includes(char)){
            common++;
          }

        }

        const overlap=
          common/Math.max(query.length,target.length);

        score+=overlap*20;

      }

      /*
        Short searches like "baq"
        should strongly match Baqarah
      */

      if(
        query.length>=2 &&
        target.startsWith(query)
      ){
        score+=30;
      }

      if(score>bestScore){

        bestScore=score;
        best=s;

      }

    }

  }

  return bestScore>=45 ? best : null;

}


/* =================================
   PARSE SEARCH
================================= */

function parseSearch(query){

  const clean=normalize(query);

  /*
    2:255
  */

  let match=clean.match(
    /^(\d{1,3})\s*:\s*(\d{1,3})$/
  );

  if(match){

    return{
      surah:Number(match[1]),
      verse:Number(match[2])
    };

  }


  /*
    2 255
  */

  match=clean.match(
    /^(\d{1,3})\s+(\d{1,3})$/
  );

  if(match){

    const a=Number(match[1]);
    const b=Number(match[2]);

    if(a>=1 && a<=114){

      return{
        surah:a,
        verse:b
      };

    }

  }


  /*
    Anything ending with a number.

    baq 255
    baqarah 255
    bq 255
    la vache 255
  */

  match=clean.match(
    /^(.+?)\s+(\d{1,3})$/
  );

  if(!match)return null;

  const name=match[1];
  const verse=Number(match[2]);

  const found=findBestSurah(name);

  if(!found)return null;

  return{
    surah:found[1],
    verse:verse
  };

}


/* =================================
   SEARCH
================================= */

async function searchVerse(){

  const query=searchInput.value.trim();

  if(!query)return;

  result.innerHTML=
  `<div class="message">Loading...</div>`;

  try{

    const parsed=parseSearch(query);

    if(!parsed){
      throw new Error();
    }

    if(
      parsed.surah<1 ||
      parsed.surah>114 ||
      parsed.verse<1
    ){
      throw new Error();
    }

    await loadVerse(
      parsed.surah,
      parsed.verse
    );

  }catch(error){

    result.innerHTML=`
      <div class="message">
        Verset introuvable.
        <div class="suggestions">
          Essaie par exemple :
          <b>baq 255</b>,
          <b>bq 255</b>,
          <b>fati 1</b>,
          <b>rahm 13</b>,
          <b>2:255</b>
        </div>
      </div>
    `;

  }

}


/* =================================
   LOAD VERSE
================================= */

async function loadVerse(surah,verse){

  if(currentAudio){

    currentAudio.pause();
    currentAudio=null;

  }

  currentSurah=surah;
  currentVerse=verse;

  try{

    const responses=await Promise.all([

      fetch(
        `${API}/ayah/${surah}:${verse}/quran-uthmani`
      ),

      fetch(
        `${API}/ayah/${surah}:${verse}/fr.hamidullah`
      ),

      fetch(
        `${API}/ayah/${surah}:${verse}/en.transliteration`
      ),

      fetch(
        `${API}/ayah/${surah}:${verse}/ar.alafasy`
      ),

      fetch(
        `${API}/surah/${surah}`
      )

    ]);

    const[
      arabicResponse,
      frenchResponse,
      translitResponse,
      audioResponse,
      surahResponse
    ]=responses;

    const[
      arabicData,
      frenchData,
      translitData,
      audioData,
      surahData
    ]=await Promise.all([

      arabicResponse.json(),
      frenchResponse.json(),
      translitResponse.json(),
      audioResponse.json(),
      surahResponse.json()

    ]);

    if(
      !arabicData.data ||
      !frenchData.data ||
      !translitData.data ||
      !audioData.data
    ){
      throw new Error();
    }

    const arabic=
      arabicData.data.text;

    const french=
      frenchData.data.text;

    const translit=
      translitData.data.text;

    const audio=
      audioData.data.audio;

    const surahName=
      arabicData.data.surah.englishName;

    const totalVerses=
      surahData.data.numberOfAyahs;


    result.innerHTML=`

      <article class="verse-card">

        <div class="verse-top">

          <span class="reference">
            ${surahName} · ${verse}
          </span>

          <button
            class="play"
            id="playBtn"
            type="button">
            ▶
          </button>

        </div>


        <div class="arabic">
          ${arabic}
        </div>


        <div class="translit">

          <span class="label">
            Transliteration
          </span>

          ${translit}

        </div>


        <div class="translation">

          <span class="label">
            Traduction française
          </span>

          ${french}

        </div>


        <audio
          id="audio"
          preload="none"
          src="${audio}">
        </audio>


        <div class="navigation">

          <button
            class="nav-btn"
            id="prevBtn"
            type="button"
            ${surah===1 && verse===1?"disabled":""}>
            ← Précédent
          </button>

          <span class="page">
            ${surah}:${verse}
          </span>

          <button
            class="nav-btn"
            id="nextBtn"
            type="button">
            Suivant →
          </button>

        </div>

      </article>

    `;


    const playBtn=
      document.getElementById("playBtn");

    currentAudio=
      document.getElementById("audio");


    playBtn.onclick=async()=>{

      if(currentAudio.paused){

        try{

          await currentAudio.play();

          playBtn.textContent="❚❚";

        }catch(error){}

      }else{

        currentAudio.pause();

        playBtn.textContent="▶";

      }

    };


    currentAudio.onended=()=>{

      playBtn.textContent="▶";

    };


    document.getElementById("prevBtn")
      .onclick=previousVerse;

    document.getElementById("nextBtn")
      .onclick=nextVerse;


    /*
      Met à jour la recherche avec
      le verset actuel
    */

    searchInput.value=
      `${surah}:${verse}`;

  }catch(error){

    result.innerHTML=
      `<div class="message">
        Impossible de charger ce verset.
      </div>`;

  }

}


/* =================================
   PREVIOUS
================================= */

async function previousVerse(){

  if(!currentSurah)return;

  if(currentVerse>1){

    await loadVerse(
      currentSurah,
      currentVerse-1
    );

    return;

  }

  if(currentSurah>1){

    try{

      const response=
        await fetch(
          `${API}/surah/${currentSurah-1}`
        );

      const data=
        await response.json();

      const last=
        data.data.numberOfAyahs;

      await loadVerse(
        currentSurah-1,
        last
      );

    }catch(error){}

  }

}


/* =================================
   NEXT
================================= */

async function nextVerse(){

  if(!currentSurah)return;

  try{

    const response=
      await fetch(
        `${API}/surah/${currentSurah}`
      );

    const data=
      await response.json();

    const total=
      data.data.numberOfAyahs;


    if(currentVerse<total){

      await loadVerse(
        currentSurah,
        currentVerse+1
      );

      return;

    }


    if(currentSurah<114){

      await loadVerse(
        currentSurah+1,
        1
      );

    }

  }catch(error){}

}


/* =================================
   EVENTS
================================= */

searchBtn.onclick=searchVerse;

searchInput.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      searchVerse();
    }
  }
);

</script>
