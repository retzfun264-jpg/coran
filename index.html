<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Widget</title>

<style>
:root{
  --bg:#191919;
  --card:#222222;
  --card2:#292929;
  --border:rgba(255,255,255,.09);
  --text:#f2f2f2;
  --muted:#999;
  --gold:#d8ad5b;
  --gold2:#b98735;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent!important;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:12px;
}

.header{
  margin-bottom:12px;
}

.title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:3px;
}

.title-icon{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:17px;
}

h1{
  margin:0;
  font-size:21px;
  letter-spacing:-.7px;
}

.subtitle{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */

.search-card{
  padding:11px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
}

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

input{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#171717;
  color:var(--text);
  font-size:12px;
}

input:focus{
  border-color:rgba(216,173,91,.55);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

.search-btn{
  padding:0 15px;
  border-radius:9px;
  background:linear-gradient(135deg,#e1bb70,#b98735);
  color:#18120a;
  font-size:12px;
  font-weight:800;
}

/* VERSE */

.verse-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(216,173,91,.035),transparent 50%),
    var(--card);
}

.verse-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.reference{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
}

.play{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:13px;
}

.arabic{
  margin:4px 0 17px;
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:28px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
}

.translit{
  margin-bottom:13px;
  color:#d8d8d8;
  font-size:12px;
  line-height:1.65;
  font-style:italic;
}

.translation{
  padding-top:12px;
  border-top:1px solid var(--border);
  color:#bdbdbd;
  font-size:12px;
  line-height:1.65;
}

.label{
  display:block;
  margin-bottom:5px;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.audio{
  display:none;
  width:100%;
  height:34px;
  margin-top:13px;
}

.audio.show{
  display:block;
}

.message{
  padding:20px;
  border:1px dashed var(--border);
  border-radius:12px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

/* MOBILE */

@media(max-width:480px){

  .app{
    padding:9px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .search-btn{
    height:37px;
  }

  .arabic{
    font-size:25px;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="header">
  <div class="title">
    <div class="title-icon">☪</div>
    <h1>Quran</h1>
  </div>
  <p class="subtitle">Search a surah and verse</p>
</header>

<section class="search-card">

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Ex : Al Baqara 255"
      autocomplete="off"
    >

    <button
      class="search-btn"
      id="searchBtn"
      type="button">
      Search
    </button>

  </div>

</section>

<section id="result">

  <div class="message">
    Search for a verse to begin.
  </div>

</section>

</main>

<script>

/* ================================
   API
================================ */

const API =
"https://api.alquran.cloud/v1";

/*
  API utilisée :
  AlQuran Cloud
*/


/* ================================
   ELEMENTS
================================ */

const searchInput =
document.getElementById("searchInput");

const searchBtn =
document.getElementById("searchBtn");

const result =
document.getElementById("result");


/* ================================
   SURAH NAMES
================================ */

const surahs = {

"fatiha":1,
"al fatiha":1,
"fatihah":1,

"baqara":2,
"al baqara":2,
"baqarah":2,

"imran":3,
"al imran":3,

"nisa":4,
"an nisa":4,

"maidah":5,
"al maidah":5,

"anam":6,
"al anam":6,

"araf":7,
"al araf":7,

"anfal":8,
"al anfal":8,

"tawba":9,
"at tawba":9,

"yunus":10,
"yusuf":12,

"kahf":18,
"al kahf":18,

"maryam":19,

"ta ha":20,
"taha":20,

"anbiya":21,

"hajj":22,

"muminun":23,

"furqan":25,

"shuara":26,

"naml":27,

"qasas":28,

"ankabut":29,

"rum":30,

"luqman":31,

"ahzab":33,

"yasin":36,
"ya sin":36,

"saffat":37,

"zumar":39,

"ghafir":40,

"fussilat":41,

"shura":42,

"zukhruf":43,

"dukhan":44,

"jathiya":45,

"ahqaf":46,

"muhammad":47,

"fath":48,

"hujurat":49,

"qaf":50,

"dhariyat":51,

"tur":52,

"najm":53,

"qamar":54,

"rahman":55,
"ar rahman":55,

"waqia":56,

"hadid":57,

"mujadila":58,

"hashr":59,

"mumtahanah":60,

"saff":61,

"jumuah":62,

"munafiqun":63,

"taghabun":64,

"talaq":65,

"tahrim":66,

"mulk":67,
"al mulk":67,

"qalam":68,

"haqqah":69,

"maarij":70,

"nuh":71,

"jinn":72,

"muzzammil":73,

"muddaththir":74,

"qiyamah":75,

"insan":76,

"mursalat":77,

"naba":78,

"naziat":79,

"abasa":80,

"takwir":81,

"infitar":82,

"mutaffifin":83,

"inshiqaq":84,

"buruj":85,

"tariq":86,

"ala":87,

"ghashiyah":88,

"fajr":89,

"balad":90,

"shams":91,

"layl":92,

"duha":93,

"sharh":94,

"tin":95,

"alaq":96,

"qadr":97,

"bayyinah":98,

"zalzalah":99,

"adiyat":100,

"qariah":101,

"takathur":102,

"asr":103,

"humazah":104,

"fil":105,

"quraysh":106,

"maun":107,

"kawthar":108,

"kafirun":109,

"nasr":110,

"masad":111,

"ikhlas":112,

"falaq":113,

"nas":114

};


/* ================================
   SEARCH
================================ */

async function searchVerse(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  if(!query){
    return;
  }

  result.innerHTML =
    `<div class="message">
      Loading...
    </div>`;

  try{

    const match =
      query.match(/(.+?)\s+(\d+)$/);

    if(!match){

      throw new Error(
        "Format : Al Baqara 255"
      );

    }

    let name =
      match[1]
        .replace(/^surah\s+/,"")
        .replace(/^sourate\s+/,"")
        .trim();

    const verse =
      Number(match[2]);

    const surah =
      surahs[name];

    if(!surah){

      throw new Error(
        "Surah not found"
      );

    }

    await loadVerse(
      surah,
      verse
    );

  }catch(error){

    result.innerHTML =
      `<div class="message">
        Impossible de trouver ce verset.<br>
        <small>
        Exemple : Al Baqara 255
        </small>
      </div>`;

  }

}


/* ================================
   LOAD VERSE
================================ */

async function loadVerse(
  surah,
  verse
){

  /*
    Arabic
  */

  const arabicResponse =
    await fetch(
      `${API}/ayah/${surah}:${verse}/quran-uthmani`
    );

  const arabicData =
    await arabicResponse.json();


  /*
    French translation
  */

  const frenchResponse =
    await fetch(
      `${API}/ayah/${surah}:${verse}/fr.hamidullah`
    );

  const frenchData =
    await frenchResponse.json();


  /*
    Transliteration
    Uses English transliteration
    and displays it separately.
  */

  const translitResponse =
    await fetch(
      `${API}/ayah/${surah}:${verse}/en.transliteration`
    );

  const translitData =
    await translitResponse.json();


  /*
    Audio
  */

  const audioResponse =
    await fetch(
      `${API}/ayah/${surah}:${verse}/ar.alafasy`
    );

  const audioData =
    await audioResponse.json();


  const arabic =
    arabicData.data.text;

  const french =
    frenchData.data.text;

  const translit =
    translitData.data.text;

  const audio =
    audioData.data.audio;


  const surahName =
    arabicData.data.surah.name;


  /*
    DISPLAY
  */

  result.innerHTML = `

    <article class="verse-card">

      <div class="verse-top">

        <span class="reference">
          ${surahName} · ${verse}
        </span>

        <button
          class="play"
          id="playBtn"
          type="button">
          ▶
        </button>

      </div>


      <!-- ARABIC -->

      <div class="arabic">
        ${arabic}
      </div>


      <!-- TRANSLITERATION -->

      <div class="translit">

        <span class="label">
          Transliteration
        </span>

        ${translit}

      </div>


      <!-- FRENCH -->

      <div class="translation">

        <span class="label">
          Traduction française
        </span>

        ${french}

      </div>


      <!-- AUDIO -->

      <audio
        id="audio"
        class="audio"
        controls
        src="${audio}">
      </audio>

    </article>

  `;


  const playBtn =
    document.getElementById("playBtn");

  const audioElement =
    document.getElementById("audio");


  playBtn.onclick = ()=>{

    if(audioElement.paused){

      audioElement.play();

      playBtn.textContent="❚❚";

      audioElement.classList.add("show");

    }else{

      audioElement.pause();

      playBtn.textContent="▶";

    }

  };


  audioElement.onended = ()=>{

    playBtn.textContent="▶";

  };

}


/* ================================
   EVENTS
================================ */

searchBtn.onclick =
searchVerse;


searchInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      searchVerse();

    }

  }
);

</script>

</body>
</html>
