<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Widget</title>

<style>
:root{
  --bg:#191919;
  --card:#202020;
  --card2:#292929;
  --border:rgba(255,255,255,.09);
  --text:#f2f2f2;
  --muted:#9b9b9b;
  --gold:#d8ad5b;
  --gold2:#b98735;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg)!important;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:12px;
}

.header{
  margin-bottom:12px;
}

.title{
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:3px;
}

.title-icon{
  width:31px;
  height:31px;
  display:grid;
  place-items:center;
  border-radius:9px;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:17px;
}

h1{
  margin:0;
  font-size:21px;
  letter-spacing:-.7px;
}

.subtitle{
  margin:0;
  color:var(--muted);
  font-size:11px;
}

/* SEARCH */

.search-card{
  padding:11px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
}

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

input{
  width:100%;
  padding:10px 11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#171717;
  color:var(--text);
  font-size:12px;
}

input:focus{
  border-color:rgba(216,173,91,.55);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

.search-btn{
  padding:0 15px;
  border-radius:9px;
  background:linear-gradient(135deg,#e1bb70,#b98735);
  color:#18120a;
  font-size:12px;
  font-weight:800;
}

/* VERSE */

.verse-card{
  padding:17px;
  border:1px solid var(--border);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(216,173,91,.035),transparent 50%),
    var(--card);
}

.verse-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.reference{
  color:var(--gold);
  font-size:11px;
  font-weight:800;
}

.play{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:rgba(216,173,91,.12);
  color:var(--gold);
  font-size:13px;
  transition:.2s;
}

.play:hover{
  background:rgba(216,173,91,.2);
  transform:scale(1.05);
}

.arabic{
  margin:4px 0 17px;
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:28px;
  line-height:1.9;
  text-align:right;
  direction:rtl;
}

.translit{
  margin-bottom:13px;
  color:#d8d8d8;
  font-size:12px;
  line-height:1.65;
  font-style:italic;
}

.translation{
  padding-top:12px;
  border-top:1px solid var(--border);
  color:#bdbdbd;
  font-size:12px;
  line-height:1.65;
}

.label{
  display:block;
  margin-bottom:5px;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.message{
  padding:20px;
  border:1px dashed var(--border);
  border-radius:12px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

/* MOBILE */

@media(max-width:480px){

  .app{
    padding:9px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .search-btn{
    height:37px;
  }

  .arabic{
    font-size:25px;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="header">
  <div class="title">
    <div class="title-icon">☪</div>
    <h1>Quran</h1>
  </div>

  <p class="subtitle">
    Search a surah and verse
  </p>
</header>

<section class="search-card">

  <div class="search">

    <input
      id="searchInput"
      type="text"
      placeholder="Ex : Baqara 255, 2:255..."
      autocomplete="off"
    >

    <button
      class="search-btn"
      id="searchBtn"
      type="button">
      Search
    </button>

  </div>

</section>

<section id="result">

  <div class="message">
    Search for a verse to begin.
  </div>

</section>

</main>

<script>

const API="https://api.alquran.cloud/v1";

const searchInput=document.getElementById("searchInput");
const searchBtn=document.getElementById("searchBtn");
const result=document.getElementById("result");

/* ================================
   NORMALIZE SEARCH
================================ */

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[']/g,"")
    .replace(/[-]/g," ")
    .replace(/\bsurah\b/g,"")
    .replace(/\bsourate\b/g,"")
    .replace(/\bverset\b/g,"")
    .replace(/\bayah\b/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* ================================
   FIND SURAH
================================ */

function findSurah(name){

  const clean=normalize(name);

  /* Exact match */

  let exact=surahs.find(
    s=>normalize(s[0])===clean
  );

  if(exact) return exact;


  /* Name contains search */

  let contains=surahs.find(
    s=>normalize(s[0]).includes(clean)
  );

  if(contains) return contains;


  /* Search contains name */

  contains=surahs.find(
    s=>clean.includes(normalize(s[0]))
  );

  if(contains) return contains;


  /* Fuzzy search */

  let best=null;
  let bestScore=0;

  for(const s of surahs){

    const target=normalize(s[0]);

    let score=0;

    for(let i=0;i<clean.length;i++){

      if(target[i]===clean[i]){
        score++;
      }

    }

    const ratio=score/
      Math.max(target.length,clean.length);

    if(ratio>bestScore){

      bestScore=ratio;
      best=s;

    }

  }

  if(bestScore>=0.45){
    return best;
  }

  return null;

}


/* ================================
   PARSE SEARCH
================================ */

function parseSearch(query){

  let clean=normalize(query);

  /*
    Formats:

    Baqara 255
    Baq 255
    Al Baqara verset 255
    2:255
    2 255
  */

  let match=clean.match(
    /^(\d{1,3})\s*[:]\s*(\d{1,3})$/
  );

  if(match){

    return {
      surah:Number(match[1]),
      verse:Number(match[2])
    };

  }


  match=clean.match(
    /^(\d{1,3})\s+(\d{1,3})$/
  );

  if(match){

    const first=Number(match[1]);
    const second=Number(match[2]);

    if(first<=114){

      return {
        surah:first,
        verse:second
      };

    }

  }


  match=clean.match(
    /^(.+?)\s+(\d{1,3})$/
  );

  if(!match){
    return null;
  }

  const name=match[1];
  const verse=Number(match[2]);

  const found=findSurah(name);

  if(!found){
    return null;
  }

  return {
    surah:found[1],
    verse:verse
  };

}


/* ================================
   SEARCH
================================ */

async function searchVerse(){

  const query=searchInput.value.trim();

  if(!query){
    return;
  }

  result.innerHTML=
  `<div class="message">Loading...</div>`;

  try{

    const parsed=parseSearch(query);

    if(!parsed){
      throw new Error();
    }

    if(
      parsed.surah<1 ||
      parsed.surah>114 ||
      parsed.verse<1
    ){
      throw new Error();
    }

    await loadVerse(
      parsed.surah,
      parsed.verse
    );

  }catch(error){

    result.innerHTML=
    `<div class="message">
      Verset introuvable.<br><br>
      <small>
        Essaie par exemple :<br>
        <b>Baq 255</b> · <b>Baqara 255</b> ·
        <b>2:255</b> · <b>2 255</b>
      </small>
    </div>`;

  }

}


/* ================================
   LOAD VERSE
================================ */

async function loadVerse(surah,verse){

  const requests=await Promise.all([

    fetch(
      `${API}/ayah/${surah}:${verse}/quran-uthmani`
    ),

    fetch(
      `${API}/ayah/${surah}:${verse}/fr.hamidullah`
    ),

    fetch(
      `${API}/ayah/${surah}:${verse}/en.transliteration`
    ),

    fetch(
      `${API}/ayah/${surah}:${verse}/ar.alafasy`
    )

  ]);

  const [
    arabicResponse,
    frenchResponse,
    translitResponse,
    audioResponse
  ]=requests;


  const [
    arabicData,
    frenchData,
    translitData,
    audioData
  ]=await Promise.all([

    arabicResponse.json(),
    frenchResponse.json(),
    translitResponse.json(),
    audioResponse.json()

  ]);


  const arabic=arabicData.data.text;
  const french=frenchData.data.text;
  const translit=translitData.data.text;
  const audio=audioData.data.audio;

  const surahName=
    arabicData.data.surah.englishName;


  result.innerHTML=`

    <article class="verse-card">

      <div class="verse-top">

        <span class="reference">
          ${surahName} · ${verse}
        </span>

        <button
          class="play"
          id="playBtn"
          type="button">
          ▶
        </button>

      </div>


      <div class="arabic">
        ${arabic}
      </div>


      <div class="translit">

        <span class="label">
          Transliteration
        </span>

        ${translit}

      </div>


      <div class="translation">

        <span class="label">
          Traduction française
        </span>

        ${french}

      </div>


      <audio
        id="audio"
        preload="none"
        src="${audio}">
      </audio>

    </article>

  `;


  const playBtn=
    document.getElementById("playBtn");

  const audioElement=
    document.getElementById("audio");


  playBtn.onclick=async()=>{

    try{

      if(audioElement.paused){

        await audioElement.play();

        playBtn.textContent="❚❚";

      }else{

        audioElement.pause();

        playBtn.textContent="▶";

      }

    }catch(error){

      playBtn.textContent="▶";

    }

  };


  audioElement.onended=()=>{

    playBtn.textContent="▶";

  };

}


/* ================================
   EVENTS
================================ */

searchBtn.addEventListener(
  "click",
  searchVerse
);

searchInput.addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      searchVerse();

    }

  }
);

</script>
