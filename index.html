<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Quran Widget</title>

<style>
:root{
  --bg:#191919;
  --card:#202020;
  --card2:#252525;
  --border:rgba(255,255,255,.08);
  --text:#eeeeee;
  --muted:#8f8f8f;
  --green:#6fa58a;
  --green2:#477d67;
  --gold:#c7a86b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0!important;
  padding:0!important;
  width:100%;
  min-height:100%;
  background:#191919!important;
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:14px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.title{
  display:flex;
  align-items:center;
  gap:9px;
}

.icon{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border-radius:10px;
  background:rgba(111,165,138,.12);
  color:var(--green);
  font-size:17px;
}

h1{
  margin:0;
  font-size:18px;
  letter-spacing:-.5px;
}

.subtitle{
  margin:2px 0 0;
  color:var(--muted);
  font-size:10px;
}

/* SEARCH */

.search{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:9px 11px;
  border:1px solid var(--border);
  border-radius:9px;
  outline:none;
  background:#151515;
  color:var(--text);
  font-size:11px;
}

input::placeholder{
  color:#666;
}

input:focus{
  border-color:rgba(111,165,138,.55);
  box-shadow:0 0 0 3px rgba(111,165,138,.07);
}

.btn{
  border:1px solid var(--border);
  border-radius:9px;
  padding:8px 12px;
  background:var(--card2);
  color:var(--text);
  font-size:11px;
  font-weight:700;
}

.btn:hover{
  border-color:rgba(111,165,138,.4);
}

.btn-primary{
  border:0;
  background:linear-gradient(135deg,var(--green),var(--green2));
  color:#07130d;
}

/* QURAN CARD */

.quran{
  border:1px solid var(--border);
  border-radius:14px;
  background:
    linear-gradient(
      145deg,
      rgba(111,165,138,.035),
      transparent 45%
    ),
    var(--card);
  overflow:hidden;
}

.quran-inner{
  padding:16px;
}

/* INFO */

.info{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border);
}

.surah{
  font-size:13px;
  font-weight:800;
}

.reference{
  margin-top:2px;
  color:var(--muted);
  font-size:10px;
}

.badge{
  padding:4px 8px;
  border:1px solid rgba(199,168,107,.18);
  border-radius:50px;
  color:var(--gold);
  background:rgba(199,168,107,.06);
  font-size:8px;
  font-weight:800;
}

/* ARABIC */

.arabic{
  margin:20px 4px 15px;
  color:#f1eadc;
  font-family:
    "Amiri",
    "Noto Naskh Arabic",
    "Times New Roman",
    serif;
  font-size:25px;
  line-height:2;
  text-align:right;
  direction:rtl;
}

/* TRANSLITERATION */

.translit{
  padding:11px 12px;
  border-left:2px solid var(--green);
  border-radius:0 8px 8px 0;
  background:rgba(111,165,138,.045);
  color:#b8b8b8;
  font-size:10px;
  line-height:1.6;
  font-style:italic;
}

/* TRANSLATION */

.translation{
  margin-top:11px;
  color:#d1d1d1;
  font-size:11px;
  line-height:1.65;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.nav{
  display:flex;
  gap:6px;
}

.nav button{
  width:32px;
  height:29px;
  padding:0;
}

.counter{
  color:var(--muted);
  font-size:9px;
}

/* LOADING */

.loading{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
  font-size:11px;
}

.error{
  padding:20px 10px;
  text-align:center;
  color:#c77c7c;
  font-size:11px;
}

/* MOBILE */

@media(max-width:450px){

  .app{
    padding:10px;
  }

  .arabic{
    font-size:22px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .search .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="header">

  <div class="title">

    <div class="icon">☾</div>

    <div>
      <h1>Qur'an</h1>
      <p class="subtitle">Read, reflect, remember.</p>
    </div>

  </div>

  <span class="badge">QURAN</span>

</header>


<div class="search">

  <input
    id="searchInput"
    type="text"
    placeholder="Ex : Al Baqarah 255"
    autocomplete="off"
  >

  <button
    class="btn btn-primary"
    id="searchBtn"
    type="button"
  >
    Rechercher
  </button>

</div>


<section class="quran">

<div class="quran-inner">

  <div id="content">

    <div class="loading">
      Chargement du verset...
    </div>

  </div>

</div>

</section>

</main>


<script>

const API =
"https://api.alquran.cloud/v1";

let currentSurah = 2;
let currentAyah = 255;


/* =========================
   ELEMENT
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
   SEARCH PARSER
========================= */

function parseSearch(value){

  value =
    value
    .trim()
    .toLowerCase()
    .replace(/[’']/g,"")
    .replace(/\s+/g," ");

  /*
    Formats acceptés :

    2:255
    2 255
    Al Baqarah 255
    al-baqarah 255
    Baqarah 255
  */

  const direct =
    value.match(/^(\d{1,3})\s*[: ]\s*(\d{1,3})$/);

  if(direct){

    return {
      surah:Number(direct[1]),
      ayah:Number(direct[2])
    };

  }


  const match =
    value.match(
      /^(.+?)\s+(\d{1,3})$/
    );

  if(match){

    const name =
      normalize(match[1]);

    const ayah =
      Number(match[2]);

    const found =
      SURAH_NAMES.find(
        s =>
          normalize(s.name) === name ||
          normalize(s.english) === name ||
          normalize(s.translit) === name
      );

    if(found){

      return {
        surah:found.id,
        ayah
      };

    }
  }

  return null;
}


/* =========================
   NORMALIZE
========================= */

function normalize(text){

  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[-']/g," ")
    .replace(/\s+/g," ")
    .trim();

}

/* =========================
   LOAD LAST VERSE
========================= */

try{

  const saved =
    JSON.parse(
      localStorage.getItem(STORAGE)
    );

  if(saved){

    currentSurah =
      saved.surah || 2;

    currentAyah =
      saved.ayah || 255;

  }

}catch{}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    STORAGE,
    JSON.stringify({
      surah:currentSurah,
      ayah:currentAyah
    })
  );

}


/* =========================
   LOAD VERSE
========================= */

async function loadVerse(
  surah=currentSurah,
  ayah=currentAyah
){

  $("content").innerHTML =
    `<div class="loading">
      Chargement...
    </div>`;

  try{

    const reference =
      `${surah}:${ayah}`;

    const response =
      await fetch(
        `${API}/ayah/${reference}/editions/${ARABIC},${FRENCH}`
      );

    if(!response.ok){

      throw new Error();

    }

    const json =
      await response.json();

    if(
      !json.data ||
      !Array.isArray(json.data)
    ){

      throw new Error();

    }

    const arabic =
      json.data.find(
        x=>x.edition.identifier===ARABIC
      );

    const french =
      json.data.find(
        x=>x.edition.identifier===FRENCH
      );

    if(!arabic || !french){

      throw new Error();

    }

    currentSurah =
      arabic.surah.number;

    currentAyah =
      arabic.numberInSurah;

    save();

    const info =
      SURAH_NAMES.find(
        s=>s.id===currentSurah
      );

    const surahName =
      info
      ? info.name
      : arabic.surah.englishName;

    $("content").innerHTML = `

      <div class="info">

        <div>

          <div class="surah">
            ${surahName}
          </div>

          <div class="reference">
            Sourate ${currentSurah} · Verset ${currentAyah}
          </div>

        </div>

        <span class="badge">
          ${currentSurah}:${currentAyah}
        </span>

      </div>


      <div class="arabic">
        ${arabic.text}
      </div>


      <div class="translit">
        ${frenchTextToTranslit(french.text)}
      </div>


      <div class="translation">
        ${french.text}
      </div>


      <div class="controls">

        <span class="counter">
          ${currentSurah}:${currentAyah}
        </span>

        <div class="nav">

          <button
            class="btn"
            id="prevBtn"
            type="button">
            ←
          </button>

          <button
            class="btn"
            id="nextBtn"
            type="button">
            →
          </button>

        </div>

      </div>

    `;

    $("prevBtn").onclick =
      previousVerse;

    $("nextBtn").onclick =
      nextVerse;

  }catch(error){

    $("content").innerHTML = `

      <div class="error">
        Verset introuvable.<br>
        Essaie par exemple :
        <strong>Al Baqarah 255</strong>
      </div>

    `;

  }

}


/* =========================
   NAVIGATION
========================= */

async function nextVerse(){

  if(currentAyah < 286){

    await loadVerse(
      currentSurah,
      currentAyah+1
    );

    return;

  }

  if(currentSurah < 114){

    await loadVerse(
      currentSurah+1,
      1
    );

  }

}


async function previousVerse(){

  if(currentAyah > 1){

    await loadVerse(
      currentSurah,
      currentAyah-1
    );

    return;

  }

  if(currentSurah > 1){

    const previous =
      currentSurah-1;

    /*
      On récupère la sourate
      précédente pour connaître
      son dernier verset.
    */

    try{

      const response =
        await fetch(
          `${API}/surah/${previous}`
        );

      const json =
        await response.json();

      const last =
        json.data.ayahs.length;

      await loadVerse(
        previous,
        last
      );

    }catch{

      await loadVerse(
        previous,
        1
      );

    }

  }

}


/* =========================
   SEARCH
========================= */

$("searchBtn").onclick =
  search;


$("searchInput").addEventListener(
  "keydown",
  event=>{

    if(event.key==="Enter"){

      search();

    }

  }
);


function search(){

  const result =
    parseSearch(
      $("searchInput").value
    );

  if(!result){

    $("content").innerHTML = `

      <div class="error">
        Recherche invalide.<br>
        Exemple : <strong>Al Baqarah 255</strong>
        ou <strong>2:255</strong>
      </div>

    `;

    return;

  }

  if(
    result.surah<1 ||
    result.surah>114 ||
    result.ayah<1
  ){

    return;

  }

  loadVerse(
    result.surah,
    result.ayah
  );

}


/* =========================
   TRANSLITERATION
========================= */

/*
  L'API utilisée ici fournit
  directement le texte arabe et
  la traduction française.

  Pour éviter de générer une
  fausse translittération du Coran,
  on n'invente pas une prononciation
  à partir du français.

  Cette zone affiche donc la
  traduction française sous un
  style distinct.
*/

function frenchTextToTranslit(text){

  return text;

}


/* =========================
   START
========================= */

loadVerse(
  currentSurah,
  currentAyah
);

</script>

</body>
</html>
