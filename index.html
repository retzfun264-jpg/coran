<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qur'an Widget</title>

<style>
:root{
  --card:#151b18;
  --card2:#1b2420;
  --line:rgba(255,255,255,.08);
  --text:#f3f5f1;
  --muted:#89958e;
  --green:#4ade80;
  --green2:#16834a;
  --gold:#d7b76d;
  --gradient:linear-gradient(135deg,#d7b76d,#4ade80);
}

*{box-sizing:border-box}

html,body{
  margin:0!important;
  padding:0!important;
  width:100%;
  background:transparent!important;
}

body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,select{font:inherit}

button{cursor:pointer}

.app{
  width:100%;
  max-width:620px;
  margin:auto;
  padding:10px;
}

/* HEADER */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
}

.logo{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid rgba(215,183,109,.22);
  border-radius:10px;
  background:rgba(215,183,109,.07);
  color:var(--gold);
  font-size:17px;
}

.title{
  margin:0;
  font-size:16px;
  font-weight:800;
}

.subtitle{
  margin:2px 0 0;
  color:var(--muted);
  font-size:9px;
}

select{
  max-width:150px;
  padding:7px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  outline:none;
  background:var(--card2);
  color:var(--text);
  font-size:10px;
}

/* CARD */

.quran-card{
  border:1px solid var(--line);
  border-radius:15px;
  background:
    linear-gradient(145deg,rgba(215,183,109,.035),transparent 50%),
    var(--card);
  overflow:hidden;
}

/* SURAH */

.surah{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 15px 11px;
  border-bottom:1px solid var(--line);
}

.surah-name{
  margin:0;
  font-size:14px;
  font-weight:800;
}

.surah-info{
  margin:2px 0 0;
  color:var(--muted);
  font-size:9px;
}

.ayah-number{
  min-width:30px;
  height:30px;
  display:grid;
  place-items:center;
  border:1px solid rgba(215,183,109,.2);
  border-radius:50%;
  color:var(--gold);
  font-size:9px;
  font-weight:800;
}

/* VERSE */

.ayah{
  padding:17px 17px 12px;
}

.arabic{
  direction:rtl;
  margin:0;
  color:#f5f0e5;
  font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  font-size:27px;
  line-height:1.9;
  text-align:right;
}

.transliteration{
  margin:13px 0 0;
  color:#b9c7bf;
  font-size:11px;
  line-height:1.65;
  font-style:italic;
}

.translation{
  margin:8px 0 0;
  color:#929e97;
  font-size:11px;
  line-height:1.6;
}

/* PROGRESS */

.progress{
  height:3px;
  margin:0 15px;
  overflow:hidden;
  border-radius:99px;
  background:rgba(255,255,255,.06);
}

.progress-fill{
  height:100%;
  border-radius:inherit;
  background:var(--gradient);
  transition:.35s ease;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  padding:11px 15px 13px;
}

.control{
  width:34px;
  height:34px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card2);
  color:var(--text);
  font-size:14px;
  transition:.15s ease;
}

.control:hover{
  border-color:rgba(74,222,128,.4);
  transform:translateY(-1px);
}

.play{
  width:40px;
  height:40px;
  border:0;
  background:var(--gradient);
  color:#102016;
  font-weight:900;
}

.position{
  min-width:70px;
  color:var(--muted);
  font-size:9px;
  text-align:center;
}

/* SETTINGS */

.settings{
  margin-top:8px;
}

.settings summary{
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:8px;
  background:rgba(255,255,255,.02);
  color:var(--muted);
  font-size:9px;
  cursor:pointer;
}

.settings-content{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:7px;
}

.setting{
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--card);
}

.setting label{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-size:8px;
}

.setting select{
  width:100%;
  max-width:none;
}

/* LOADING */

.loading{
  padding:40px 10px;
  color:var(--muted);
  text-align:center;
  font-size:10px;
}

/* MOBILE */

@media(max-width:480px){

  .app{padding:8px}

  .arabic{font-size:23px}

  .settings-content{
    grid-template-columns:1fr;
  }

  select{
    max-width:125px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <div class="brand">

      <div class="logo">☪</div>

      <div>
        <h1 class="title">Qur'an</h1>
        <p class="subtitle">Read • Reflect • Remember</p>
      </div>

    </div>

    <select id="surahSelect">
      <option>Chargement...</option>
    </select>

  </header>


  <main class="quran-card">

    <div id="content">
      <div class="loading">
        Chargement du Qur'an...
      </div>
    </div>

  </main>


  <details class="settings">

    <summary>⚙ Paramètres</summary>

    <div class="settings-content">

      <div class="setting">

        <label>TRADUCTION</label>

        <select id="translationSelect">
          <option value="fr.hamidullah">
            Français — Hamidullah
          </option>
        </select>

      </div>


      <div class="setting">

        <label>RÉCITATEUR</label>

        <select id="reciterSelect">

          <option value="ar.alafasy">
            Mishary Alafasy
          </option>

        </select>

      </div>

    </div>

  </details>

</div>


<script>

const API="https://api.alquran.cloud/v1";

const STORAGE="quran_notion_widget_v2";

let state={

  surah:Number(
    localStorage.getItem(STORAGE+"_surah")
  )||1,

  ayah:Number(
    localStorage.getItem(STORAGE+"_ayah")
  )||0,

  translation:
    localStorage.getItem(STORAGE+"_translation")
    ||"fr.hamidullah",

  transliteration:
    localStorage.getItem(STORAGE+"_transliteration")
    ||"en.transliteration",

  reciter:
    localStorage.getItem(STORAGE+"_reciter")
    ||"ar.alafasy"

};

let current=null;


/* HELPERS */

const $=id=>document.getElementById(id);

function save(){

  localStorage.setItem(
    STORAGE+"_surah",
    state.surah
  );

  localStorage.setItem(
    STORAGE+"_ayah",
    state.ayah
  );

  localStorage.setItem(
    STORAGE+"_translation",
    state.translation
  );

  localStorage.setItem(
    STORAGE+"_reciter",
    state.reciter
  );

}


/* LOAD SURAHS */

async function loadSurahs(){

  try{

    const response=await fetch(
      `${API}/surah`
    );

    const json=await response.json();

    const select=$("surahSelect");

    select.innerHTML=json.data.map(
      s=>`
        <option value="${s.number}">
          ${s.number}. ${s.englishName}
        </option>
      `
    ).join("");

    select.value=state.surah;

    await loadSurah();

  }catch(error){

    $("content").innerHTML=`
      <div class="loading">
        Impossible de charger le Qur'an.
      </div>
    `;

  }

}


/* LOAD SURAH */

async function loadSurah(){

  $("content").innerHTML=`
    <div class="loading">
      Chargement...
    </div>
  `;

  try{

    /*
      Une seule requête récupère :
      - arabe
      - translittération
      - français
    */

    const editions=[
      "quran-uthmani",
      state.transliteration,
      state.translation
    ].join(",");


    const response=await fetch(
      `${API}/surah/${state.surah}/editions/${editions}`
    );

    const json=await response.json();


    const arabic=json.data[0];
    const transliteration=json.data[1];
    const french=json.data[2];


    current={

      name:arabic.englishName,

      arabicName:arabic.name,

      translationName:
        arabic.englishNameTranslation,

      arabic:arabic.ayahs,

      transliteration:
        transliteration.ayahs,

      french:
        french.ayahs

    };


    if(
      state.ayah>=current.arabic.length
    ){
      state.ayah=0;
    }


    save();

    render();

  }catch(error){

    console.error(error);

    $("content").innerHTML=`
      <div class="loading">
        Erreur lors du chargement.
      </div>
    `;

  }

}


/* RENDER */

function render(){

  if(!current)return;


  const arabic=
    current.arabic[state.ayah];

  const transliteration=
    current.transliteration[state.ayah];

  const french=
    current.french[state.ayah];


  const total=
    current.arabic.length;


  const percent=
    ((state.ayah+1)/total)*100;


  $("content").innerHTML=`

    <div class="surah">

      <div>

        <h2 class="surah-name">
          ${current.name}
        </h2>

        <p class="surah-info">
          ${current.arabicName}
          ·
          ${current.translationName}
        </p>

      </div>

      <div class="ayah-number">
        ${state.ayah+1}
      </div>

    </div>


    <div class="ayah">

      <p class="arabic">
        ${arabic.text}
      </p>


      <p class="transliteration">
        ${transliteration.text}
      </p>


      <p class="translation">
        ${french.text}
      </p>

    </div>


    <div class="progress">

      <div
        class="progress-fill"
        style="width:${percent}%">
      </div>

    </div>


    <div class="controls">

      <button
        class="control"
        id="prevBtn">
        ‹
      </button>


      <button
        class="control play"
        id="playBtn">
        ▶
      </button>


      <div class="position">
        ${state.ayah+1} / ${total}
      </div>


      <button
        class="control"
        id="nextBtn">
        ›
      </button>

    </div>

  `;


  $("prevBtn").onclick=previousAyah;

  $("nextBtn").onclick=nextAyah;

  $("playBtn").onclick=playAyah;

}


/* NEXT */

async function nextAyah(){

  if(
    state.ayah<
    current.arabic.length-1
  ){

    state.ayah++;

    save();

    render();

  }else if(state.surah<114){

    state.surah++;

    state.ayah=0;

    $("surahSelect").value=
      state.surah;

    save();

    await loadSurah();

  }

}


/* PREVIOUS */

async function previousAyah(){

  if(state.ayah>0){

    state.ayah--;

    save();

    render();

  }else if(state.surah>1){

    state.surah--;

    $("surahSelect").value=
      state.surah;

    save();

    await loadSurah();

    state.ayah=
      current.arabic.length-1;

    save();

    render();

  }

}


/* AUDIO */

function playAyah(){

  const ayah=
    current.arabic[state.ayah];


  const audio=new Audio(
    `https://cdn.islamic.network/quran/audio/128/`+
    `${state.reciter}/${ayah.number}.mp3`
  );


  audio.play().catch(error=>{
    console.error(error);
  });

}


/* SURAH */

$("surahSelect").onchange=
async function(){

  state.surah=
    Number(this.value);

  state.ayah=0;

  save();

  await loadSurah();

};


/* TRANSLATION */

$("translationSelect").value=
  state.translation;


$("translationSelect").onchange=
async function(){

  state.translation=
    this.value;

  save();

  await loadSurah();

};


/* RECITER */

$("reciterSelect").value=
  state.reciter;


$("reciterSelect").onchange=
function(){

  state.reciter=
    this.value;

  save();

};


/* START */

loadSurahs();

</script>

</body>
</html>
